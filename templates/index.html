<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Recognition System</title>
    <meta name="description" content="Real-time American Sign Language recognition with speech output">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <span class="logo-icon">🤟</span>
                <h1>ASL Recognition</h1>
            </div>
            <div class="status-badge" id="modelStatus">
                <span class="status-dot"></span>
                <span class="status-text">Checking...</span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Video Section -->
            <section class="video-section">
                <div class="video-container">
                    <img id="videoFeed" src="/video_feed" alt="Camera Feed" class="video-feed">
                    <div class="video-overlay">
                        <div class="prediction-display" id="predictionDisplay">
                            <span class="prediction-letter" id="predictionLetter">-</span>
                            <span class="prediction-confidence" id="predictionConfidence">0%</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Controls Section -->
            <section class="controls-section">
                <!-- Word Display -->
                <div class="word-display-container">
                    <label class="section-label">Recognized Text</label>
                    <div class="word-display" id="wordDisplay">
                        <span class="placeholder-text">Show signs to camera...</span>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="button-group">
                    <button id="addLetterBtn" class="btn btn-primary">
                        <span class="btn-icon">+</span>
                        Add Letter
                    </button>
                    <button id="speakBtn" class="btn btn-success">
                        <span class="btn-icon">🔊</span>
                        Speak
                    </button>
                    <button id="clearBtn" class="btn btn-danger">
                        <span class="btn-icon">×</span>
                        Clear
                    </button>
                </div>

                <!-- ASL Reference -->
                <div class="asl-reference">
                    <label class="section-label">ASL Alphabet Guide</label>
                    <div class="alphabet-grid" id="alphabetGrid">
                        <!-- Generated by JavaScript -->
                    </div>
                </div>
            </section>
        </main>

        <!-- Audio Player (hidden) -->
        <audio id="audioPlayer" style="display: none;"></audio>

        <!-- Footer -->
        <footer class="footer">
            <p>ASL Sign Language Recognition System • Real-time Gesture-to-Speech Conversion</p>
        </footer>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
